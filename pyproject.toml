[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vmtools"
version = "0.1.0"
description = "windowsvm, linuxvm, androidvm — sibling CLIs to iosvm/macosvm"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
windowsvm = "windowsvm.cli:main"
linuxvm = "linuxvm.cli:main"
androidvm = "androidvm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vmtools", "src/windowsvm", "src/linuxvm", "src/androidvm"]

[tool.hatch.build]
dev-mode-dirs = ["src"]
