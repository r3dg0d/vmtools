[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vmtools"
version = "0.1.2"
description = "windowsvm, linuxvm, androidvm — sibling CLIs to iosvm/macosvm"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
windowsvm = "windowsvm.cli:main"
linuxvm = "linuxvm.cli:main"
androidvm = "androidvm.cli:main"
vmtools = "vmtools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vmtools", "src/windowsvm", "src/linuxvm", "src/androidvm"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# Deliberately modest and pinned here so CI does not depend on any global ruff config.
select = ["E4", "E7", "E9", "F", "I", "UP"]
# The codebase deliberately joins short statements with semicolons.
ignore = ["E702"]
